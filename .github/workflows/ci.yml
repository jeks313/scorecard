name: ci

# Renovate merges its own PRs only when this is green, so it has to exercise
# what actually ships: the image, started, answering HTTP.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build image
        run: docker build -t smoke -f server/Dockerfile server
      - name: Start it and expect HTTP 200 from /healthz
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e DB_PATH=/tmp/scores.db smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
            [ "$code" = 200 ] && exit 0
            sleep 1
          done
          echo "last status: $code"; docker logs smoke; exit 1
