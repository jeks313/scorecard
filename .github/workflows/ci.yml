name: ci

# `just check` runs the same checks locally.
# Renovate merges its own PRs only when this is green, so it has to exercise
# what actually ships: the image, started, answering HTTP.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Keep in step with the golang: tag in the Dockerfile. Explicit, not
          # go-version-file: Renovate never bumps go.mod's go directive.
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: server
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
      - name: govulncheck
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build -t smoke -f server/Dockerfile server
      - name: Start it and expect HTTP 200 from /healthz
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e DB_PATH=/tmp/scores.db smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
            [ "$code" = 200 ] && exit 0
            sleep 1
          done
          echo "last status: $code"; docker logs smoke; exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      # The CLI, not gitleaks-action: the action left MIT at v2.
      - name: gitleaks
        env:
          # renovate: datasource=go depName=github.com/zricethezav/gitleaks/v8
          GITLEAKS_VERSION: v8.30.1
        run: go run github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION git --redact -v .
