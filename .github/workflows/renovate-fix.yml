name: renovate-fix

# When CI fails on a Renovate PR, ask Claude to make the code work with the
# new version and push the fix onto the Renovate branch, so the PR becomes one
# reviewable change: the bump plus what it needed. Part of fleet's unattended
# dependency loop (vault: Plans/Home Fleet Agent/Fleet Dependency Updates).
#
# Guards:
#   - only a failed `ci` run on a renovate/* branch whose head commit Renovate
#     itself authored, so Claude's own push can never re-trigger this;
#   - one attempt per PR (the claude-fix-attempted label);
#   - it pushes to the Renovate branch only and never merges -- a major still
#     waits for a person, a non-major goes through Renovate's own automerge
#     once CI is green.
#
# The push uses the Renovate App's token, not GITHUB_TOKEN: pushes made with
# GITHUB_TOKEN do not trigger workflows, and the fix needs CI to judge it.
#
# Secrets: RENOVATE_APP_ID, RENOVATE_APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN.
# Without the last one the job skips itself.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/') &&
      github.event.workflow_run.head_commit.author.name == 'jeks313-renovate[bot]' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Configured?
        id: cfg
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ok=$HAS_CLAUDE" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v2
        if: steps.cfg.outputs.ok == 'true'
        id: app
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: One attempt per PR
        if: steps.cfg.outputs.ok == 'true'
        id: claim
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx claude-fix-attempted; then
            echo "already attempted on #$PR"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh label create claude-fix-attempted -R "$GITHUB_REPOSITORY" --color 5319e7 \
            --description "Claude tried to fix this Renovate PR" --force
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label claude-fix-attempted
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Failed CI log
        if: steps.claim.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed | tail -n 400 > "$RUNNER_TEMP/ci-failure.log"

      - uses: actions/checkout@v7
        if: steps.claim.outputs.go == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        if: steps.claim.outputs.go == 'true'
        with:
          go-version-file: server/go.mod
      - name: Git identity
        if: steps.claim.outputs.go == 'true'
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        if: steps.claim.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Renovate PR #${{ env.PR }} on branch ${{ env.BRANCH }} in ${{ github.repository }}
            updates a dependency, and CI failed. The failing jobs' log (last 400
            lines) is at ${{ runner.temp }}/ci-failure.log.

            Goal: make this repository work with the NEW version. Do not revert,
            pin back or skip the update, and do not weaken, skip or delete tests
            or CI checks to get green.

            1. Read the log and .github/workflows/ci.yml to see what failed and how
               CI checks it. Read the dependency's changelog or migration notes if
               the break is an API change.
            2. Make the smallest change that fixes it, in the style of the code
               around it. If a lockfile needs regenerating, use the command
               recorded in its header or the repo's own tooling.
            3. Run the same checks CI runs, locally, until they pass.
            4. Commit with a message that says what the new version changed and
               what you adapted, then `git push origin HEAD:${{ env.BRANCH }}`.
               Push once, at the end.

            If it cannot be fixed safely -- the new version needs a design
            decision, or you are not confident -- push nothing and instead leave
            one comment on PR #${{ env.PR }} (gh pr comment) explaining what broke
            and what a fix would involve.
          claude_args: >-
            --max-turns 60
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,WebFetch,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(go:*),Bash(docker:*),Bash(curl:*)"
